# marcellus configuration
#
# Copy this file to config/sidecar.yml and edit. The non-example form is
# gitignored so your real values stay out of the repo.

frigate:
  # Frigate's HTTP API base URL. Used to build snapshot/clip URLs in the UI,
  # and for the sidecar's own unauthenticated server-to-server calls.
  base_url: http://frigate.lan:5000
  # Frigate's AUTHENTICATED origin, used ONLY to proxy app traffic
  # (routes/proxy.py). Auth stays entirely Frigate's -- the sidecar forwards
  # the client's own cookie and never holds a password. Do not merge with
  # base_url above (docs/scrub-cache-and-proxy-spec.md §3.2).
  proxy_base_url: http://frigate.lan:8971
  # Path to Frigate's config.yml (inside the sidecar container).
  config_path: /opt/frigate/config.yml
  # Path to Frigate's main SQLite database (inside the sidecar container).
  db_path: /opt/frigate/database/frigate.db
  # The container-side recordings root as Frigate's own DB stores it in
  # recordings.path (e.g. what Frigate's docker-compose bind-mounts to
  # /media/frigate). Used only to strip this prefix before reattaching
  # recordings_path below.
  media_path: /media/frigate
  # The HOST-side path that REPLACES media_path above. `recordings.path` rows
  # read `<media_path>/recordings/<date>/...`, so the `recordings/` segment
  # comes from the DB value and must NOT be repeated here -- pointing this at
  # .../recordings/recordings maps every segment one level too deep, every
  # lookup misses, and generation produces nothing.
  # Get the host side with
  # `docker inspect <frigate-container> --format '{{json .Mounts}}'`, then
  # confirm by ls-ing a real recordings.path row rewritten through this prefix.
  recordings_path: /mnt/frigate-storage/recordings

sidecar:
  # Path to the sidecar's own SQLite database (triage labels, etc.).
  db_path: /data/marcellus.db
  # Bind address. 0.0.0.0 + host networking exposes the service on the LAN.
  bind_host: 0.0.0.0
  bind_port: 5001
  # Require the client's Frigate session cookie on every endpoint the sidecar
  # owns -- the triage UI, /faces, /analysis, /toybox and /v1. The sidecar sits
  # on the same LAN origin as Frigate and serves event history, face crops of
  # identified people, and writes that reach back into Frigate, so leaving it
  # open is a way around Frigate's own auth. The proxy catch-all is never gated
  # here (Frigate authenticates that traffic itself). Set false only if your
  # Frigate has auth disabled, in which case there is no session to check.
  require_frigate_auth: true
  auth_cache_ttl_s: 60.0        # how long a validated cookie is trusted
  auth_cache_max_entries: 1024  # bound: Frigate rotates its JWT

# External health watchdog. Polls Frigate's API and restarts the container when
# the backend hangs (connection-refused or repeated 5xx) — the failure mode
# Docker's restart policy can't catch (s6 PID 1 stays alive while the app wedges
# on a frozen camera stream). Runs as its own process via the
# frigate-watchdog.service unit in contrib/, NOT inside the web app. Off by
# default; needs User=root in the unit so it can run `docker restart`.
watchdog:
  enabled: false
  probe_path: /api/version       # 200 even in safe mode, so bad config won't loop
  interval_s: 30.0
  timeout_s: 10.0
  failures_before_restart: 4     # 4 × 30s ≈ 2 min of sustained failure
  restart_command: ["docker", "restart", "frigate"]
  restart_timeout_s: 120.0
  cooldown_s: 180.0              # ignore failures this long after a restart (boot)
  max_restarts_per_hour: 3       # safety cap; logs loudly instead of looping


# High-res cross-camera face capture (B2). When a person event fires on a
# TRIGGER camera, grab the CAPTURE camera's full main-stream frame out of
# Frigate's recordings at that moment, for human review at /faces/captures.
#
# One HTTP GET does it: /api/{camera}/recordings/{ts}/snapshot.jpg returns the
# full main-stream frame -- no ffmpeg, no seek, no recordings-table lookup.
#
# Runs as a systemd oneshot (contrib/marcellus-face-capture.{service,timer}),
# NOT in-process: that endpoint 404s until the segment covering the timestamp is
# committed, and segments commit at their END, so the work is inherently
# deferred by tens of seconds and an MQTT "grab it now" hook would 404 always.
face_capture:
  enabled: false
  trigger_cameras: []          # [] = feature does nothing, even when enabled
  capture_camera: ""           # the single supporting identification camera
  trigger_labels: ["person"]
  offsets_s: [-4.0, 0.0, 4.0]  # capture cam's own event starts a median 2.2s EARLY
  capture_delay_s: 45.0        # ~4x the measured 5.4-9.4s recording publish lag
  lookback_s: 3600.0
  dedup_window_s: 60.0         # one visit fires on 3-4 cameras within seconds
  max_visit_s: 300.0           # cap a gap-chained loiter
  max_captures_per_run: 60
  max_attempts: 3
  apply_annotation_offset: true
  crop_to_bbox: true           # preview only, and only from the CAPTURE cam's own box
  head_fraction: 0.4
  crop_pad: 0.25
  thumb_max_edge: 480
  # MUST be writable by the unit: ProtectSystem=strict with
  # ReadWritePaths=/opt/marcellus means anything outside fails EROFS at
  # WRITE time, not config load -- a silent no-op.
  output_dir: /opt/marcellus/data/face-captures
  retention_days: 30

# Face enrichment (B3): embeddings + temporal aggregation + identity clusters.
# Needs `pip install "marcellus[enrich]"` (insightface/onnxruntime, CPU
# only). For each ended person event on an enrolled camera, samples full-res
# recording frames, embeds the best faces, and matches identity clusters at
# /enrich/clusters — naming a cluster makes later matches write the event's
# sub_label back to Frigate (the sidecar should then be the ONLY sub_label
# writer: disable Frigate's own face recognition on these cameras).
face_enrich:
  enabled: false
  cameras: []                 # [] = feature does nothing, even when enabled
  interval_s: 15.0
  process_delay_s: 45.0       # recordings commit at segment END (see face_capture)
  lookback_s: 3600.0
  max_frames: 40
  min_sample_gap_s: 1.0
  best_n: 5
  min_face_area_px: 4000      # px on the main-stream frame
  min_quality: 0.15
  match_threshold: 0.45       # cosine distance to a NAMED cluster -> sub_label
  cluster_threshold: 0.55     # cosine distance to join an unnamed cluster
  cluster_ttl_days: 60        # unnamed clusters expire; named ones never do
  model_dir: /opt/marcellus/data/models   # buffalo_l cache, ~300 MB
  max_events_per_cycle: 10
  max_attempts: 3

# Uniform-cadence sprite-sheet scrub cache (docs/scrub-cache-and-proxy-spec.md).
# Off by default; opt-in per deployment. enabled=true starts the continuous
# ~60s in-process generator (server.py lifespan, §5.4a) in addition to
# advertising the capability -- requires ffmpeg/ffprobe on PATH and a
# frigate.recordings_path mount/host-path that resolves.
scrub:
  enabled: false
  cameras: []              # [] = all cameras; else an opt-in list
  # MUST be a separate filesystem from frigate.recordings_path -- the
  # recordings volume was measured at 99% full / 27 GB free on the reference
  # deployment and cannot absorb the cache too (§8.3, hard requirement).
  cache_dir: /data/scrub
  recent_interval_s: 1.0
  aged_interval_s: 5.0
  # Generate a camera at its own keyframe cadence when that is coarser than
  # recent_interval_s, rather than full-decoding to force the configured rate.
  # A source whose GOP is longer than the target can only hit it by decoding
  # every frame -- ~5x the cost -- to synthesise stills the encoder never made
  # distinct. UniFi Protect cameras emit a keyframe every 5s and expose no
  # setting to change it; Dahua-style cameras here emit one a second. The
  # cadence travels per bucket in `interval`, so a camera generating at 5s is
  # contract-compatible: it just yields a still every 5s while scrubbing.
  match_keyframe_cadence: true
  # Tiers derived from the recent/aged decode tiers by picking every Nth
  # already-published cell and re-tiling -- no ffmpeg, generated last in each
  # cycle out of whatever's left of the tick's deadline. [] disables this.
  # derived_intervals_s: [60.0, 300.0, 900.0, 3600.0]
  aged_after_h: 24.0
  # Capped by how long CONTINUOUS (non-motion-only) recording actually lasts,
  # not by disk budget or record.retain.days. Measured at ~4 days on the
  # reference deployment (docs spec §5.5, M3) -- past that, footage is
  # motion-only and too fragmentary to sample at a uniform interval.
  retention_days: 4
  cell_w: 320
  # Fallback height only. With preserve_source_aspect on (the default), each
  # camera's cell height is derived from its own display aspect ratio instead:
  # a 4:3 camera scaled into a 16:9 cell comes out anamorphically squeezed, and
  # nothing downstream can undo it because the pixels are already wrong. The
  # resulting dimensions travel per sheet in the cell_w/cell_h metadata.
  cell_h: 180
  preserve_source_aspect: true
  sheet_cols: 12
  sheet_rows: 8
  # "jpeg" | "webp". JPEG measured smaller than WebP on real camera content
  # (604 KB vs 827 KB for a 96-cell sheet, §5.3 M4) -- WebP is opt-in only,
  # and requires -lossless 0 explicitly or ffmpeg silently ships near-lossless
  # (~1 MB) sheets.
  format: jpeg               # validated at load; a typo is a startup error
  generate_interval_s: 60.0  # continuous edge -- NEVER hourly (§5.4)
  # Retention sweep, run by the same in-process loop. Pruning used to be
  # CLI-only, so an unattended deployment kept every sheet it ever generated.
  prune_interval_s: 3600.0
  # Bounds concurrent ffmpeg/ffprobe children. Segments within a camera are
  # sampled serially (cell assignment is order-dependent), so this only bites
  # when a CLI backfill runs alongside the in-process generator.
  ffmpeg_concurrency: 3
  # The live edge is generated first, for every camera, out of its own budget
  # (§5.4) -- the reel opens at `now`, so that is where sprites have to exist.
  # Only what's left goes to backfill, which fills in behind it.
  live_edge_segments: 30       # per camera per cycle; the edge needs ~6
  live_edge_lookback_s: 900.0  # a staler cache jumps to the edge, gap behind
  # Backfill allowance for the WHOLE cycle, split across cameras. Bounding the
  # cycle rather than each camera keeps the next live-edge pass punctual; an
  # over-long cycle makes the edge slip again. Raise to backfill faster at the
  # cost of a longer cycle, or narrow `cameras` above.
  backfill_segments_per_cycle: 120

# Transparent reverse proxy to Frigate's authenticated origin, giving the app
# one base URL. See docs/scrub-cache-and-proxy-spec.md §6.
proxy:
  enabled: true
  pass_request_headers: [range, authorization, cookie]

# Push notifications (docs/push-notifications.md). Off by default -- push is
# the last capability tier to light up, never a dependency of any other one.
push:
  enabled: false
  # "mock" logs what would be sent and always succeeds -- the only transport
  # usable without real APNs credentials, and the safe default. "relay" posts
  # the minimal, content-free payload to relay_base_url below.
  transport: mock
  # Short opaque id of this sidecar instance, sent in the push payload so a
  # device with more than one server registered can route the NSE's handle
  # fetch correctly. Leave blank to auto-generate one at startup.
  server_id: ""
  mqtt_host: frigate.lan
  mqtt_port: 1883
  mqtt_username: null
  mqtt_password: null
  # Hard cap on the consumer queue depth; non-terminal frames are dropped
  # (mqtt.dropped.overflow, see /v1/stats) rather than growing unbounded.
  mqtt_queue_max: 2000
  mqtt_topic_reviews: frigate/reviews
  mqtt_topic_available: frigate/available
  reconnect_backoff_s: 2.0
  reconnect_backoff_max_s: 60.0
  # After this long without any broker traffic, treat Frigate as possibly
  # offline; on reconnect, back-fill the gap from /api/events before
  # resuming live pushes rather than silently dropping an alert.
  offline_silence_s: 60.0
  backfill_lookback_s: 60.0
  # Only used when transport: relay. The relay holds the one real APNs .p8
  # key and never receives camera names, labels, or snapshots -- only
  # {device_token, environment, handle, server_id, severity}.
  relay_base_url: https://push-relay.example.invalid
  # Per-attempt timeout; a 3-attempt retryable send is bounded at roughly
  # 2*relay_timeout_s + relay_timeout_s + ~2s of backoff.
  relay_timeout_s: 5.0
  # Total attempts for retryable kinds (push, liveactivity start/end); 1 =
  # no retry. Retryable outcomes: connect/timeout errors, 5xx, 429.
  # liveactivity update/situation/test always send once, never retried.
  relay_retry_attempts: 3
  # Consecutive attempt-level transport failures (exception or 5xx; 429/4xx
  # never count) that open the circuit breaker and short-circuit further
  # relay sends -- see "Relay breaker" on /status.
  relay_breaker_failures: 3
  # How long the breaker stays open before a single half-open probe attempt.
  relay_breaker_open_s: 30.0
  # How long a minted handle (opaque camera/event-id reference for the NSE's
  # handle-redemption fetch) stays valid.
  handle_ttl_s: 3600.0

log_level: INFO
