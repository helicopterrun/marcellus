[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marcellus"
dynamic = ["version"]
description = "Companion server for Frigate NVR: triage UI and read-only analysis tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "helicopterrun" }]
# Major-version caps only: two builds of the same tag should not silently
# resolve across an API-breaking release (there is no lockfile — the Docker
# image and install.sh both do a fresh resolve at build/install time).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.13,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "pillow>=10.4,<12",
    "paho-mqtt>=2.1,<3",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
annotation = [
    # Used by analysis.annotation_offset (template matching).
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]
enrich = [
    # faces.enrich: SCRFD detection + ArcFace embeddings (buffalo_l pack),
    # CPU-only by design — see FaceEnrichSection for the OpenVINO/iGPU story.
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]
http2 = [
    # Lets push.transport.RelayTransport hold one long-lived HTTP/2
    # connection to the relay. Optional: without it the client falls back to
    # HTTP/1.1 keep-alive, which reuses the connection just the same and is
    # where nearly all of the saving comes from for a one-request-at-a-time
    # sender.
    "httpx[http2]>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=6",
    "types-PyYAML",
    # test_proxy_ws.py skips silently without this
    "websockets>=13",
]

[project.scripts]
marcellus = "marcellus.cli:app"
fsc = "marcellus.cli:app"

[tool.hatch.version]
path = "src/marcellus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marcellus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
# Test the working tree, not whatever was last pip-installed. CI installs
# editable so the two coincide there, but every prod install is a plain copy
# (install.sh, `pip install /opt/marcellus`), and on such a box a bare
# `pytest` imported dist-packages instead -- green on stale code, or red on code
# the checkout had already fixed. Cost of this: the suite no longer exercises
# the built artifact at all, so a data file that fails to ship in the wheel is
# invisible here. Assert packaging invariants against the package root instead
# (see test_scenarios_ship_inside_the_package_not_the_repo).
pythonpath = ["src"]

[tool.mypy]
# Prod (bare-metal LXC) runs 3.10 — typecheck against the oldest supported runtime.
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_reexport = true
strict_equality = true
# Global on purpose: paho/cv2/uvicorn ship no stubs. Removing this means
# vendoring or writing stubs — revisit if their APIs ever bite us silently.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's bundled stubs use the 3.12+ `type` statement, which mypy refuses to
# parse under python_version = 3.10. Treat numpy as untyped instead.
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["marcellus"]

[tool.coverage.report]
# Floor = measured total (78% on 2026-08-20) minus slack. Raise it as
# coverage grows; never lower it to admit a regression.
fail_under = 76
