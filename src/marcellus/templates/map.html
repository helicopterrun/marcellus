{% extends "base.html" %}
{% set active_page = 'map' %}
{% block title %}Map · Marcellus{% endblock %}

{% block page_heading %}<h1 class="sr-only">Map editor</h1>{% endblock %}
{% block body %}
<main id="main-content" class="me-root">
  <div id="me-banner" class="help page-intro" style="display:none"></div>
  <div class="me-frame">
    <div id="me-toolbar" class="me-toolbar"></div>
    <div id="me-stage" class="me-stage cam-map skeleton"></div>
    <aside id="me-panel" class="me-panel"></aside>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>window.LENS_PRESETS = {{ lens_presets_json | safe }};</script>
<script type="module" src="/static/js/mapedit/main.js?v={{ asset_v }}"></script>
{% endblock %}
