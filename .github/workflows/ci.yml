name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is what prod runs (bare-metal LXC); 3.12 is the Docker image.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        # The scrub-generator tests probe GOP cadence with ffprobe; without it
        # they fail with KeyError on profile.gop_s.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy src/marcellus
      # Coverage (with the fail_under floor from pyproject.toml) runs on one
      # matrix leg only — 3.10/3.12 branch differences would make a shared
      # floor jitter for no signal.
      - name: Test
        if: matrix.python-version != '3.12'
        run: pytest -ra
      - name: Test with coverage floor
        if: matrix.python-version == '3.12'
        run: pytest -ra --cov=marcellus
